<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Consultation</title>
  <style>
  .form-note {
    margin-top: 14px;
    margin-bottom: 0;
    font-size: 13px;
    text-align: center;
    color: #777;
  }
    
  * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin-bottom: 16px;
  padding: 7px 10px;
  border-radius: 20px;
  background: #f0f0f0;
}

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="badge">AI AUTOMATION SYSTEMS</div>
    <h1>Turn repetitive work into automated systems.</h1>
<p>
  Tell us what's slowing your business down. We'll review your workflow
  and identify where automation can save time and improve follow-up.
</p>

    <form
      action="https://salimluay.app.n8n.cloud/webhook/305c374a-7a41-4835-89a5-23f236984902"
      method="POST"
    >

      <label>Name</label>
      <input type="text" name="name" required />

      <label>Email</label>
      <input type="email" name="email" required />

      <label>What would you like to automate?</label>
      <textarea
        name="message"
        rows="6"
        placeholder="Example: I want to automatically capture leads from my website and notify my sales team..."
        required
      ></textarea>
      <div style="position:absolute; left:-9999px;" aria-hidden="true">
        <label for="website">Website</label>
        <input
          type="text"
          id="website"
          name="website"
          tabindex="-1"
          autocomplete="off"
        />
      </div>
      <button type="submit">Request Automation Review</button>
      <p class="form-note">
        No commitment. We'll review your workflow and get back to you shortly.
      </p>
    </form>
  </div>

</body>
</html>
